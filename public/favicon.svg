<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 560 520"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Geometric triangulated T icon</title>
  <desc id="desc">A wireframe letter T built from connected triangular segments with cyan nodes.</desc>

  <defs>
    <filter id="cyanGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer T silhouette -->
    <path d="M58 70 L270 92 L490 70
             M58 70 L126 184 L214 184
             M490 70 L420 184 L328 184
             M214 184 L214 338 L270 444 L328 338 L328 184"
          stroke="#F7F7F7" stroke-width="4"/>

    <!-- Top triangulation -->
    <path d="M58 70 L176 120 L126 184
             M58 70 L214 184
             M176 120 L270 92
             M176 120 L270 164
             M126 184 L270 164
             M214 184 L270 164
             M270 92 L270 164
             M270 92 L370 120
             M270 164 L370 120
             M270 164 L328 184
             M370 120 L328 184
             M370 120 L490 70
             M370 120 L420 184
             M328 184 L420 184
             M270 92 L490 70"
          stroke="#F7F7F7" stroke-width="4"/>

    <!-- Stem triangulation -->
    <path d="M214 184 L270 164 L328 184
             M214 184 L216 242 L270 306
             M328 184 L326 242 L270 306
             M216 242 L270 164
             M326 242 L270 164
             M216 242 L326 242
             M216 242 L214 338
             M326 242 L328 338
             M214 338 L270 306 L328 338
             M214 338 L270 444
             M328 338 L270 444
             M270 164 L270 306
             M270 306 L270 444"
          stroke="#F7F7F7" stroke-width="4"/>

    <!-- Cyan emphasized center spokes -->
    <path d="M270 92 L270 164
             M214 184 L270 164
             M328 184 L270 164
             M216 242 L270 164
             M326 242 L270 164"
          stroke="#37C8FF" stroke-width="4" filter="url(#cyanGlow)"/>

    <!-- Cyan end rings -->
    <circle cx="58" cy="70" r="13" stroke="#37C8FF" stroke-width="5"/>
    <circle cx="490" cy="70" r="13" stroke="#37C8FF" stroke-width="5"/>
    <circle cx="270" cy="444" r="13" stroke="#37C8FF" stroke-width="5"/>

    <!-- Cyan center node -->
    <circle cx="270" cy="164" r="5" fill="#37C8FF" stroke="#37C8FF" filter="url(#cyanGlow)"/>

    <!-- Small cyan connection nodes -->
    <g fill="#37C8FF" stroke="none">
      <circle cx="270" cy="92" r="4"/>
      <circle cx="214" cy="184" r="4"/>
      <circle cx="328" cy="184" r="4"/>
      <circle cx="216" cy="242" r="4"/>
      <circle cx="326" cy="242" r="4"/>
      <circle cx="270" cy="306" r="4"/>
    </g>
  </g>
</svg>
